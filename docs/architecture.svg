<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="590" viewBox="0 0 1120 590" role="img" aria-labelledby="title desc"><title id="title">EvidenceDesk architecture</title><desc id="desc">A local interface captures sources. Strands runs a real local model with evidence-search and validated-record tools. Original findings are sealed separately from attributed review before export.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#649385" stroke-width="1.5"/></marker></defs><rect width="1120" height="590" rx="20" fill="#f3f7f3"/><g font-family="system-ui,sans-serif" fill="#183943"><text x="40" y="48" font-size="25" font-weight="650">EvidenceDesk</text><text x="40" y="75" font-size="13" fill="#607971">Local reasoning. Source checks. Reviewable decisions.</text></g><g fill="white" stroke="#cdded4" stroke-width="1.5"><rect x="35" y="155" width="200" height="110" rx="12"/><rect x="280" y="155" width="220" height="110" rx="12"/><rect x="550" y="155" width="220" height="110" rx="12"/><rect x="830" y="155" width="245" height="110" rx="12"/><rect x="550" y="320" width="220" height="90" rx="12"/><rect x="280" y="460" width="220" height="90" rx="12"/><rect x="550" y="460" width="220" height="90" rx="12"/><rect x="830" y="460" width="245" height="90" rx="12"/></g><g stroke="#649385" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M235 210H278"/><path d="M500 210H548"/><path d="M770 210H828"/><path d="M660 265V318"/><path d="M550 365H390V267"/><path d="M952 265V430H390V458"/><path d="M500 505H548"/><path d="M770 505H828"/></g><g font-family="system-ui,sans-serif" fill="#183943" text-anchor="middle"><text x="135" y="190" font-size="16" font-weight="650">Researcher + local UI</text><text x="135" y="218" font-size="12">Questions, URLs, source text</text><text x="135" y="238" font-size="12">FastAPI + browser</text><text x="390" y="190" font-size="16" font-weight="650">Sealed source snapshots</text><text x="390" y="218" font-size="12">Normalized paragraphs</text><text x="390" y="238" font-size="12">Provenance + SHA-256</text><text x="660" y="190" font-size="16" font-weight="650">Strands agent</text><text x="660" y="218" font-size="12">One question per conversation</text><text x="660" y="238" font-size="12">Real local Ollama / Qwen3</text><text x="952" y="190" font-size="16" font-weight="650">Validated recording</text><text x="952" y="218" font-size="12">Exact quote + paragraph checks</text><text x="952" y="238" font-size="12">Invalid anchors stay unresolved</text><text x="660" y="355" font-size="16" font-weight="650">Search evidence tool</text><text x="660" y="384" font-size="12">Reads only this case's snapshots</text><text x="390" y="495" font-size="16" font-weight="650">Original agent record</text><text x="390" y="524" font-size="12">Inputs + findings + actual events</text><text x="660" y="495" font-size="16" font-weight="650">Attributed review ledger</text><text x="660" y="524" font-size="12">Type + name; preserve originals</text><text x="952" y="495" font-size="16" font-weight="650">Portable ZIP packet</text><text x="952" y="524" font-size="12">HTML / Markdown / JSON / CSV / hashes</text></g></svg>
